<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>くじゲーム</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/style.css" />
    </head>
    <body>
        <div id="page" class="page">
            <header id="header" class="header">
                <a href="../../index.html">
                    <img
                        class="header__img"
                        src="../../imgs/logo.png"
                        alt="ロゴ画像"
                    />
                </a>
                <nav class="header__nav">
                    <ul class="header__nav-list">
                        <li><a href="../../../index.html">ホーム</a></li>
                        <li><a href="../../HTML/aboutMe.html">自己紹介</a></li>
                        <li id="current">
                            <a href="../../HTML/assignment.html">課題</a>
                        </li>
                        <li><a href="../../HTML/sonota.html">その他</a></li>
                    </ul>
                </nav>
            </header>

            <main id="main" class="main">
                <section class="main__section lottery-game">
                    <h2 style="font-size: 2em;">くじゲーム</h2>
                    <p style="margin: 1em;">くじゲームへようこそ！レアキャラを当ててみてください！！</p>
                    <button onclick="startTimer()" class="btn">スタート</button>
                    <button onclick="stopTimer()" class="btn">ストップ</button>
                    <div id="counter"></div>
                </section>
            </main>

            <footer id="footer" class="footer">
                <p id="copyright" class="footer__copyright">
                    <small>&copy; 2026 Koya Kudo</small>
                </p>
            </footer>
        </div>
        <script>
            let timerId = NaN;
            let count = 0;
            let imglink = new Array();

            for (let i = 0; i < 10; i++) {
                imglink[i] =
                    "<img src='../../imgs/lottery-imgs/" +
                    (i + 1) +
                    ".png' alt='" +
                    (i + 1) +
                    "' />";
            }

            function startTimer() {
                if (!isNaN(timerId)) {
                    return;
                }
                timerId = setInterval(tick, 50);
            }

            function stopTimer() {
                clearInterval(timerId);
                timerId = NaN;
            }

            function tick() {
                document.getElementById("counter").innerHTML = imglink[count];
                count++;
                if (count == 10) count = 0;
            }
        </script>
    </body>
</html>
