<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>ぷよぷよゲーム(完成版)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/style.css" />
    </head>
    <body>
        <div id="page" class="page">
            <header id="header" class="header">
                <a href="../../index.html">
                    <img
                        class="header__img"
                        src="../../imgs/logo.png"
                        alt="ロゴ画像"
                    />
                </a>
                <nav class="header__nav">
                    <ul class="header__nav-list">
                        <li><a href="../../../index.html">ホーム</a></li>
                        <li><a href="../../HTML/aboutMe.html">自己紹介</a></li>
                        <li id="current">
                            <a href="../../HTML/assignment.html">課題</a>
                        </li>
                        <li><a href="../../HTML/sonota.html">その他</a></li>
                    </ul>
                </nav>
            </header>

            <main id="main" class="main">
                <section class="main__section puyo-game">
                    <div class="puyo-game__intro">
                        <h2>ぷよぷよ(完成版)</h2>
                        <p>
                            ぷよぷよへようこそ！左右キーで移動、スペースキーで上下のぷよを入れ替え(回転)できます。<br />
                            同じ色を3つ以上つなげると消えてスコアが加算されます。連鎖すると得点も高くなります。<br />
                            ハイスコアは自動的に保存され、次にプレイするときも表示されます。右側には次に降ってくるぷよ(NEXT)も表示されます。
                        </p>
                        <button class="startBtn btn">ゲーム開始</button>
                    </div>
                    <div
                        id="gameArea"
                        class="puyo-game__gameArea"
                        style="display: none"
                    >
                        <canvas id="gameCanvas" width="532" height="660"></canvas>
                        <button id="endGame" class="btn">ゲーム終了</button>
                    </div>
                </section>
            </main>

            <footer id="footer" class="footer">
                <p id="copyright" class="footer__copyright">
                    <small>&copy; 2026 Koya Kudo</small>
                </p>
            </footer>
        </div>

        <script src="../../JS/puyoGame3.js"></script>
    </body>
</html>
