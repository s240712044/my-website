<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>数当てゲーム</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/style.css" />
    </head>
    <body>
        <div id="page" class="page">
            <header id="header" class="header">
                <a href="../../index.html">
                    <img
                        class="header__img"
                        src="../../imgs/logo.png"
                        alt="ロゴ画像"
                    />
                </a>
                <nav class="header__nav">
                    <ul class="header__nav-list">
                        <li><a href="../../../index.html">ホーム</a></li>
                        <li><a href="../../HTML/aboutMe.html">自己紹介</a></li>
                        <li id="current">
                            <a href="../../HTML/assignment.html">課題</a>
                        </li>
                        <li><a href="../../HTML/sonota.html">その他</a></li>
                    </ul>
                </nav>
            </header>

            <main id="main" class="main">
                <section class="main__section number-guessing-game">
                    <div class="number-guessing-game__intro">
                        <h2>数当てゲーム</h2>
                        <p>
                            数当てゲームへようこそ！コンピュータがランダムに選んだ1から100までの数字を当ててください。ヒントを参考にして、できるだけ少ない回数で正解を見つけましょう！
                        </p>
                        <button class="startBtn">ゲーム開始</button>
                    </div>
                    <div
                        id="gameArea"
                        class="number-guessing-game__gameArea"
                        style="display: none"
                    >
                        <p id="feedback"></p>
                        <input
                            type="number"
                            id="guessInput"
                            placeholder="1から100の数字を入力"
                        />
                        <button id="submitGuess">予想を送信</button>
                        <button id="endGame">ゲームを終了</button>
                    </div>
                </section>
            </main>

            <footer id="footer" class="footer">
                <p id="copyright" class="footer__copyright">
                    <small>&copy; 2026 Koya Kudo</small>
                </p>
            </footer>
        </div>

        <script src="../../JS/numberGuessingGame.js"></script>
    </body>
</html>
